<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Where a Threadlight pilot stands, what is in the way, and the one next step."
    />
    <title>Threadlight pilot</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-proven" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.8 8.2l2.1 2.1 4.3-4.6" class="ink" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-done" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8.2l2 2 4-4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-prepared" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 010 12.5z" fill="currentColor"/></symbol>
      <symbol id="i-partial" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 8V1.75A6.25 6.25 0 0114.25 8z" fill="currentColor"/></symbol>
      <symbol id="i-in-progress" viewBox="0 0 16 16"><path d="M8 1.75A6.25 6.25 0 1114.25 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12.4 6.2l1.85 1.8 1.6-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-human" viewBox="0 0 16 16"><circle cx="8" cy="5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.8 14.2a5.2 5.2 0 0110.4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-current" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="3" fill="currentColor"/></symbol>
      <symbol id="i-waiting" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.4 2.2"/><path d="M8 4.8V8l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-todo" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
      <symbol id="i-skipped" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-failed" viewBox="0 0 16 16"><path d="M5.2 1.5h5.6l3.7 3.7v5.6l-3.7 3.7H5.2l-3.7-3.7V5.2z" fill="currentColor"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" class="ink" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-stale" viewBox="0 0 16 16"><path d="M8 1.6l6.6 11.6a.8.8 0 01-.7 1.2H2.1a.8.8 0 01-.7-1.2z" fill="currentColor"/><path d="M8 6v3.6" class="ink" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.8" r=".95" class="ink-fill"/></symbol>
      <symbol id="i-ready" viewBox="0 0 16 16"><path d="M3.5 14.5V2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3.5 2.5h8.6l-1.8 2.9 1.8 2.9H3.5z" fill="currentColor"/></symbol>
      <symbol id="i-unknown" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.6 2.4"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13.2 6.2A5.4 5.4 0 003.4 4.6M2.8 9.8a5.4 5.4 0 009.8 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13.6 2.6v3.8H9.8M2.4 13.4V9.6h3.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-mark" viewBox="0 0 16 16"><path d="M2 12.5C5 12.5 6 3.5 9 3.5s3.2 5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="2.4" cy="12.4" r="1.6" fill="currentColor"/></symbol>
    </svg>

    <div class="app">
      <header class="app-bar">
        <p class="app-name">
          <svg class="icon" aria-hidden="true"><use href="#i-mark"/></svg>
          Threadlight pilot
        </p>
        <p id="updated" class="updated"></p>
        <button id="refresh" class="icon-button" type="button" aria-label="Reload from the workspace">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>
      </header>

      <p id="status" class="load-status" role="status">Loading the workspace…</p>

      <p id="live" class="visually-hidden" aria-live="polite"></p>

      <main id="content" class="content" aria-labelledby="pilot-name" hidden></main>
    </div>

    <dialog id="start-dialog" aria-labelledby="start-title">
      <form id="start-form" method="dialog">
        <h2 id="start-title">Start a different pilot</h2>
        <p class="hint">Chat will confirm before anything is created.</p>
        <label for="dialog-brief">Process brief</label>
        <textarea id="dialog-brief" name="brief" required maxlength="4000"></textarea>
        <div class="dialog-actions">
          <button id="send-brief" class="primary" type="submit" value="default">Send to chat</button>
          <button id="cancel-brief" class="secondary" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
