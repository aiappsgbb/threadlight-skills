name: python-pytest

# Lightweight unit-test gate for the threadlight skill pack.
#
# Runs on every PR and push to main. Catches python regressions in the
# scripts under skills/*/scripts/ — no Azure cost, no model tokens, no
# external network. Complements the heavy threadlight-e2e-foundry.yml
# workflow (which runs azd up against a real Foundry account on manual
# dispatch only).
#
# Currently exercises:
#   - skills/threadlight-consumption-iq/tests/  (125 tests, including a
#     deterministic golden-file e2e against the sample-pilot-consumption
#     fixture — uses a mock pricing client, no network)
#   - skills/threadlight-design/tests/           (skill-contract linter: the 12
#     SKC checks over a generated pilot's src/agent/skills/, plus a smoke test
#     asserting the shipped examples/returns-triage-governed pilot stays
#     contract-clean; hermetic tmp_path fixtures, no network)
#   - skills/threadlight-production-ready/tests/ (covers COST-005/006 +
#     existing pillar tests)
#   - skills/threadlight-auto/tests/             (orchestrator state
#     machine, includes the evals/redteam/govern Discover/Protect stage
#     probes — run as a standalone script since the suite uses main() —
#     PLUS test_e2e_control_plane.py, the offline cross-skill E2E that
#     chains govern+evals+redteam → production-ready KPI scorecard →
#     cicd gates against the green fixtures; collected by pytest)
#   - skills/threadlight-evals/tests/            (Discover evals leg — offline
#     batch + online/continuous eval + A/B gate; deterministic, no network)
#   - skills/threadlight-redteam/tests/          (Discover safety leg — AI Red
#     Teaming Agent scan mapper; deterministic, no network)
#   - skills/threadlight-govern/tests/           (Protect leg — AGT runtime
#     governance verifier; deterministic, no network)
#   - skills/threadlight-cicd/tests/             (prod CI/CD pipeline +
#     env-setup runbook generator — deterministic, secret-free, no network)
#   - skills/threadlight-customize/tests/        (fork-and-customize final
#     leg — instructions-only: version + structure + no-secrets/anonymization)
#   - skills/threadlight-router-bench/tests/     (offline self-improvement cold-
#     path: learn single-run CI learnings + bench cost scorecard; gh/az calls
#     are dependency-injected with fixture runners — deterministic, no network)
#   - skills/threadlight-event-triggers/tests/   (six receiver scaffolds: each
#     pure idempotent handle() core — fresh/duplicate/failure paths + key
#     derivation + a structural "shipped" guard that py_compiles every scaffold.
#     Imports the receiver cores with NO azure SDKs installed — all azure.*
#     imports are lazy — so it runs stdlib-only, no network)
#   - skills/_shared/tests/                       (the shared threadlight.*/v1
#     manifest envelope that the connect/ground/loadtest/upgrade gap-evidence
#     legs all emit under — schema/validator parity, deterministic, no network)
#   - skills/threadlight-qualify/tests/           (no-repo/Cowork qualification +
#     sizing; includes the isolated Cowork bundle test that runs the BUILT
#     docs/downloads/threadlight-qualify.zip — the workflow builds the zip in a
#     preceding step so the bundle test has an artifact instead of skipping)
#   - skills/threadlight-connect/tests/           (CONNECT leg — evidence-based
#     mock→real tool swap gate; deterministic, no network)
#   - skills/threadlight-ground/tests/            (GROUND leg — ACL/citation/
#     refusal grounding evidence assessor; deterministic, no network)
#   - skills/threadlight-loadtest/tests/          (LOAD leg — budget-capped load
#     evidence with an injected fake adapter; deterministic, no network)
#   - skills/threadlight-upgrade/tests/           (UPGRADE leg — plan-only
#     compatibility/preview-drift scan against a fixture matrix; no network)
#   - skills/threadlight-safe-check/tests/        (completeness gate, incl. the
#     applied mock→real integration-binding recognition; static, no network)
#
# Every step is a hard gate — no `continue-on-error`. Stdlib-only suites that
# expose `t_*` functions plus a main() instead of pytest-collectable `test_*`
# functions are executed by scripts/ci/run-standalone-tests.py, which discovers
# them rather than hard-coding a list.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pyyaml packaging
      - name: Guard - SKILL.md description length (<=1024 chars)
        # Deterministic per-PR guard for the silent loader-drop regression:
        # any skills/*/SKILL.md whose parsed `description` exceeds 1024 chars
        # is dropped from the Copilot CLI registry. The heavier
        # skill-discovery-smoke.sh confirms this end-to-end but only runs on
        # manual dispatch, so this cheap static check gates every PR.
        run: python scripts/ci/check-skill-description-length.py
      - name: Guard - every pytest suite is wired into this workflow
        # This workflow hardcodes one step per test directory, so a newly added
        # suite runs locally, goes green on the PR, and never actually executes
        # in CI — a green check that lies about coverage. Same failure class the
        # repo already closed for stdlib-only suites via run-standalone-tests.py.
        run: python scripts/ci/check-test-dirs-wired.py
      - name: Run design→deploy pilot contract tests
        # The design→deploy artifact contract used to live only as inline bash
        # inside the ~$1 manually-dispatched E2E workflow, so in practice it was
        # verified once every few weeks. check_pilot_contract.py expresses the
        # same contract as a free, deterministic, local-runnable check and this
        # suite runs it against examples/returns-triage-governed on every PR —
        # plus proves every rule can actually fail.
        run: python -m pytest scripts/ci/tests/ -v
      - name: Run threadlight-consumption-iq tests
        run: python -m pytest skills/threadlight-consumption-iq/tests/ -v
      - name: Run threadlight shared-contract tests
        # The shared manifest envelope (skills/_shared/manifest.py) that the
        # connect/ground/loadtest/upgrade gap-evidence legs all emit under.
        run: python -m pytest skills/_shared/tests/ -v
      - name: Build Cowork skill zips (bundle artifact for the qualify bundle test)
        # threadlight-qualify's tests/test_cowork_bundle.py runs the BUILT +
        # extracted docs/downloads/threadlight-qualify.zip from outside the repo
        # tree (empty PYTHONPATH) to prove the vendored cost runtime + dated
        # pricing fixtures ride along. It SKIPS when the zip is absent, so build
        # it here first — this step MUST precede "Run threadlight-qualify tests".
        run: bash scripts/build-cowork-zips.sh
      - name: Guard - committed Cowork zips are in sync with source
        # docs/downloads/*.zip are BUILT artifacts. This rebuilds them into a
        # throwaway dir and compares against the committed archives by member
        # name + CRC — recursing into vendor/cost-runtime.zip — so a source edit
        # that was not followed by `bash scripts/build-cowork-zips.sh` fails here
        # instead of silently shipping a stale bundle to Cowork sellers. It is
        # content-based (not a raw `git diff` of bytes) so it stays robust to zip
        # timestamp churn and macOS-vs-Linux `zip` differences; the builder is
        # separately made byte-reproducible so "rebuild twice" is a no-op.
        run: python scripts/ci/check_cowork_zip_drift.py
      - name: Run threadlight-qualify tests
        # No-repo/Cowork qualification & sizing. Includes the isolated Cowork
        # bundle test that consumes the zip built in the previous step.
        run: python -m pytest skills/threadlight-qualify/tests/ -v
      - name: Run threadlight-connect tests
        run: python -m pytest skills/threadlight-connect/tests/ -v
      - name: Run threadlight-ground tests
        run: python -m pytest skills/threadlight-ground/tests/ -v
      - name: Run threadlight-loadtest tests
        run: python -m pytest skills/threadlight-loadtest/tests/ -v
      - name: Run threadlight-upgrade tests
        run: python -m pytest skills/threadlight-upgrade/tests/ -v
      - name: Run threadlight-safe-check tests
        # Includes the applied mock→real integration binding recognition that
        # threadlight-connect's --apply produces.
        run: python -m pytest skills/threadlight-safe-check/tests/ -v
      - name: Run threadlight-design tests
        # Contract linter for a generated pilot's src/agent/skills/. The suite
        # also asserts the shipped examples/returns-triage-governed pilot stays
        # contract-clean, so the reference implementation cannot drift away from
        # the rules the skill tells the model to generate against.
        run: python -m pytest skills/threadlight-design/tests/ -v
      - name: Run threadlight-production-ready tests
        run: python -m pytest skills/threadlight-production-ready/tests/ -v
      - name: Run threadlight-auto tests
        run: python -m pytest skills/threadlight-auto/tests/ -v
      - name: Run standalone (non-pytest) test suites
        # Several suites are stdlib-only scripts exposing `t_*` functions and a
        # main() instead of pytest-collectable `test_*` functions. pytest
        # imports them, collects 0, and stays green — so their assertions never
        # ran in CI. This runner discovers every such file under skills/ and
        # executes it directly, so a newly added stdlib-only suite is picked up
        # automatically instead of silently going unwatched.
        run: python scripts/ci/run-standalone-tests.py
      - name: Run threadlight-evals tests
        run: python -m pytest skills/threadlight-evals/tests/ -v
      - name: Run threadlight-redteam tests
        run: python -m pytest skills/threadlight-redteam/tests/ -v
      - name: Run threadlight-govern tests
        run: python -m pytest skills/threadlight-govern/tests/ -v
      - name: Run threadlight-cicd tests
        run: python -m pytest skills/threadlight-cicd/tests/ -v
      - name: Run threadlight-customize tests
        run: python -m pytest skills/threadlight-customize/tests/ -v
      - name: Run threadlight-router-bench tests
        # Offline self-improvement cold-path: learn (single-run CI learnings) +
        # bench (cost scorecard). Deterministic, stdlib-only, no Azure/gh network
        # (all gh/az calls are dependency-injected with fixture runners in tests).
        run: python -m pytest skills/threadlight-router-bench/tests/ -v
      - name: Run threadlight-event-triggers tests
        # Six receiver scaffolds. Each receiver core exposes a pure, injectable
        # handle() (fresh/duplicate/failure + key derivation) and a structural
        # guard that py_compiles every scaffold and asserts the "shipped" file
        # set. All azure.* imports are lazy, so the cores import under this
        # stdlib-only runner (pytest + pyyaml). Deterministic, no network.
        run: python -m pytest skills/threadlight-event-triggers/tests/ -v
      - name: Run threadlight-deploy tests
        # Guards the `azd ai agent` command surface the deploy path drives. The
        # extension is beta and ships often; when a subcommand disappears the
        # failure otherwise surfaces at deploy time as `unknown command` (which
        # is exactly how a mandatory Step 6 gate shipped broken). Static: reads
        # markdown, runs no azd, no network.
        run: python -m pytest skills/threadlight-deploy/tests/ -v
