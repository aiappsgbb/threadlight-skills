# Existing-infrastructure deployment template, NOT a provisioning plan.
# Materialize sources, publish signed policy, and supply built images first.
name: returns-triage
services:
  returns-triage:
    project: ./src/agent
    host: azure.ai.agent
    language: docker
    image: ${TL_GOV_AGENT_IMAGE}
    kind: hosted
    name: returns-triage
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_CLIENT_ID
        value: ${RETURNS_AGENT_CLIENT_ID}
      - name: FOUNDRY_PROJECT_ENDPOINT
        value: ${CITADEL_PROJECT_ENDPOINT}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: gpt-5.4
      - name: FOUNDRY_AGENT_VERSION
        value: ${FOUNDRY_AGENT_VERSION}
      - name: TL_GOV_IMAGE_DIGEST
        value: ${TL_GOV_IMAGE_DIGEST}
      - name: TL_GOV_SPOOL_DIR
        value: ${TL_GOV_SPOOL_DIR}
      - name: GOV_CONTROL_PLANE_URL
        value: ${GOV_CONTROL_PLANE_URL}
  governance-control-plane:
    project: ./src/governance-control-plane
    host: containerapp
    language: docker
    image: ${TL_GOV_CONTROL_IMAGE}
    env:
      TL_GOV_SERVICE: control-plane
      GOV_CONFIG_JSON: ${GOV_CONFIG_JSON}
      AZURE_CLIENT_ID: ${GOV_CONTROL_CLIENT_ID}
