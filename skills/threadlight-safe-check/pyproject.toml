[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlight-governance-safe-check"
version = "0.1.0"
requires-python = ">=3.12"
description = "Explicit signed-noop hosted governance collector and static gates"
dependencies = [
  "threadlight-govern-gateway==0.1.0",
  "azure-ai-projects==2.3.0",
  "azure-identity==1.25.3",
  "httpx==0.28.1",
  "openai==2.54.0",
]

[project.scripts]
threadlight-governance-probe = "governance_references.governance_probe:main"
threadlight-safe-check = "threadlight_safe_check.safe_check:main"

[tool.setuptools]
packages = ["threadlight_safe_check", "governance_references", "govern_deployment", "govern_native", "govern_canonical", "skills._shared"]
package-dir = {threadlight_safe_check = "scripts", governance_references = "references", govern_deployment = "../threadlight-deploy/references/governance", govern_native = "../threadlight-govern/references/runtime", govern_canonical = "../threadlight-governed-actions/scripts", "skills._shared" = "../_shared"}

[tool.setuptools.package-data]
"skills._shared" = ["*.json"]
govern_deployment = ["*.toml", "*.bicep"]
