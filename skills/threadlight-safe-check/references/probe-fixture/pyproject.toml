[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlight-govern-probe-fixture"
version = "0.3.1"
requires-python = ">=3.12,<3.13"
dependencies = ["threadlight-govern-gateway==0.4.0"]

[project.scripts]
threadlight-govern-probe-fixture = "govern_probe_fixture.app:main"

[tool.setuptools]
packages = ["govern_probe_fixture"]
package-dir = {govern_probe_fixture = "."}
