[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlight-govern-probe-fixture"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["threadlight-govern-gateway==0.1.0"]

[project.scripts]
threadlight-govern-probe-fixture = "govern_probe_fixture.app:main"

[tool.setuptools]
packages = ["govern_probe_fixture"]
package-dir = {govern_probe_fixture = "."}
