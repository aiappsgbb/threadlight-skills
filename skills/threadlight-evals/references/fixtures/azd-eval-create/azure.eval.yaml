# Generated by threadlight-evals scripts/eval_yaml.py. Commit it.
# tlb-agent-gate: held-out rows, trajectory-mapped rubric; the release gate.
# tlb-agent-optimizer-input: optimizer rows, no dataMapping; only for
#   azd ai agent optimize --eval tlb-agent-optimizer-input
evaluators:
  - name: tlb-rubric
    source: ./evaluators/tlb-rubric.json
datasets:
  - name: tlb-agent-optimize
    file: ./datasets/tlb-agent-optimize.jsonl
  - name: tlb-agent-heldout
    file: ./datasets/tlb-agent-heldout.jsonl
evals:
  - name: tlb-agent-gate
    dataset: tlb-agent-heldout
    evaluationLevel: turn
    evaluators:
      - evaluator: tlb-rubric
        name: tlb-rubric-trajectory
        initializationParameters:
          model: gpt-5.4-mini
        dataMapping:
          query: "{{item.query}}"
          response: "{{sample.output_items}}"
          ground_truth: "{{item.ground_truth}}"
          tool_calls: "{{sample.tool_calls}}"
          tool_definitions: "{{sample.tool_definitions}}"
      - evaluator: builtin.task_adherence
        initializationParameters:
          model: gpt-5.4-mini
    target:
      type: agent
      name: tlb-agent
  - name: tlb-agent-optimizer-input
    dataset: tlb-agent-optimize
    evaluationLevel: turn
    evaluators:
      - evaluator: tlb-rubric
        initializationParameters:
          model: gpt-5.4-mini
      - evaluator: builtin.task_adherence
        initializationParameters:
          model: gpt-5.4-mini
    target:
      type: agent
      name: tlb-agent
