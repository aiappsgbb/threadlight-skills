name: Governed Actions

# This fixture's single declared workflow deliberately carries every
# GitHub Copilot / CI-plane weakness the GHCP rules look for, in the two
# jobs a real repository would normally split across separate files.

# Deploys directly on push to the default branch -- no pull-request gate
# at all. GHCP-001.
on:
  push:
    branches: [main]
  pull_request:

# Excessive, non-least-privilege permission grant, inherited by every job
# that does not set its own. GHCP-004.
permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Floating tag, not a 40-character commit SHA. GHCP-004.
      - uses: actions/checkout@v4

      # Service-principal client-secret login, not OIDC/WIF, and no
      # `id-token: write` permission anywhere in this workflow. GHCP-005.
      # Shares the same client-id as the test job's login below. GHCP-006.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: unprotected-ghcp-app

  test:
    runs-on: ubuntu-latest
    # No job-level `permissions:` block -- silently inherits the
    # workflow-level `write-all` above. GHCP-004.
    steps:
      # Floating tag, not a 40-character commit SHA. GHCP-004.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reuses the exact same client-id as the deploy job's login.
      # GHCP-006. No `permissions: id-token: write` is granted anywhere in
      # this workflow, so even this OIDC-shaped login is not actually
      # backed by federated credentials. GHCP-005.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: pip install -r requirements.txt

      # No CTK run and no governed application-probe command anywhere in
      # this pull_request-triggered workflow. GHCP-003.
      - run: pytest tests/
