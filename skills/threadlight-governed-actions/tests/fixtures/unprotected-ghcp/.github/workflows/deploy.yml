name: Deploy

# Deploys directly on push to the default branch -- no pull-request gate at
# all. GHCP-001.
on:
  push:
    branches: [main]

# Excessive, non-least-privilege permission grant. GHCP-004.
permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Floating tag, not a 40-character commit SHA. GHCP-004.
      - uses: actions/checkout@v4

      # Service-principal client-secret login, not OIDC/WIF, and no
      # `id-token: write` permission anywhere in this workflow. GHCP-005.
      # Shares the same client-id as tests.yml's login below. GHCP-006.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: unprotected-ghcp-app
