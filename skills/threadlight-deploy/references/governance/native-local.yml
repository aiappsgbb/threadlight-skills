name: Native local governance
on:
  pull_request:
permissions:
  contents: read
jobs:
  native-local:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Official CTK and installed native observation
        run: |
          python .governance-tools/scripts/ci/run-governance-pin-tests.py
          python .governance-tools/scripts/ci/run-governance-pin-tests.py --prepare-local
      - name: Selected business action local gate
        run: python .governance-tools/skills/threadlight-governed-actions/scripts/governed_actions.py --target . --phase pre-deploy --gate
