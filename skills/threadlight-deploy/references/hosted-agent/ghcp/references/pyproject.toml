[project]
name = "my-agent"
version = "1.0.0"
requires-python = ">=3.12"
# Every direct dependency is pinned EXACT (==); requirements.lock carries the
# full sha256-hashed closure that the Dockerfile installs with --require-hashes.
dependencies = [
    "github-copilot-sdk==1.0.1",
    # 1.3.0 (GA) adds the typed Voice Live Bridge host used by the opt-in
    # voice front-end (THREADLIGHT_VOICE_BRIDGE=1); text-only agents use the
    # same InvocationAgentServerHost as before.
    "azure-ai-agentserver-invocations==1.3.0",
    # Transitive dep of -invocations (declares `core>=2.3.0,<3.0.0`). Pinned
    # EXACT so a core minor release cannot silently change fresh builds.
    "azure-ai-agentserver-core==2.3.0",
    "azure-identity==1.25.3",
    "python-dotenv==1.2.2",
]

[tool.setuptools]
packages = []

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
prerelease = "if-necessary-or-explicit"
