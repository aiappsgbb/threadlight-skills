[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlight-govern-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
description = "Independent authenticated governance reference service"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.12.1",
  "cryptography==48.0.0",
  "azure-core==1.41.0",
  "azure-identity==1.25.3",
  "azure-cosmos==4.16.1",
  "azure-storage-blob==12.29.0",
  "azure-keyvault-keys==4.10.0",
  "aiohttp==3.13.5",
  "uvicorn==0.47.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools]
packages = ["govern_control_plane"]
package-dir = {govern_control_plane = "."}
