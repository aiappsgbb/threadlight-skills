[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlight-govern-control-plane"
version = "0.5.0"
requires-python = ">=3.12"
description = "Independent authenticated governance reference service"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.13.0",
  "cryptography==49.0.0",
  "azure-core==1.41.0",
  "azure-identity==1.25.3",
  "azure-cosmos==4.16.1",
  "azure-storage-blob==12.29.0",
  "azure-keyvault-keys==4.10.0",
  "aiohttp==3.14.3",
  "uvicorn==0.47.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
hosted-operator = ["azure-ai-projects==2.3.0"]

[project.scripts]
threadlight-review-action = "govern_control_plane.review:main"
threadlight-confirm-action = "govern_control_plane.confirmation_user:main"
threadlight-operate-action = "govern_control_plane.operator:main"

[tool.setuptools]
packages = ["govern_control_plane"]
package-dir = {govern_control_plane = "."}
